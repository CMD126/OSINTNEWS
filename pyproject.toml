[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "osintnews"
version = "2.1.0"
description = "News Intelligence GUI + OSINT Identity CLI — DuckDuckGo dorking with optional RAG AI analysis"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "CMD126" }]
keywords = ["osint", "dorking", "threat-intelligence", "cli", "rag"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Security",
]
dependencies = [
    "ddgs>=6.0.0",
    "colorama>=0.4.6",
    "requests>=2.32.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
ai     = ["anthropic>=0.49.0", "openai>=1.50.0", "google-generativeai>=0.8.0"]
notify = ["plyer>=2.1.0"]
dev    = ["pytest>=7.0.0"]
all    = ["osintnews[ai,notify]"]

[project.urls]
Homepage = "https://github.com/CMD126/OSINTNEWS"
Issues   = "https://github.com/CMD126/OSINTNEWS/issues"

[project.scripts]
osintnews     = "osintnews:main"
osintnews-cli = "osintnews_cli:main"

[tool.setuptools]
py-modules = ["osintnews", "osintnews_cli"]

[tool.setuptools.packages.find]
include = ["modules*"]
