name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # Only what the test suite imports. The AI provider SDKs, plyer and
      # openpyxl are optional at runtime and every test stubs the network.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ddgs>=6.0.0" "colorama>=0.4.6" "requests>=2.32.0" "pytest>=7.0.0"

      - name: Run tests
        run: python -m pytest
